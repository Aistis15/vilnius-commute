# The Mac kit's project: project.yml, signed by Xcode with a free Apple ID.
#
# Generated by Tools/ci/build_mac_kit.sh next to a copy of project.yml, so
# the include below resolves to that copy. XcodeGen merges an included spec
# additively (dictionaries merged, arrays appended) and this file wins on
# every value it sets; `:REPLACE` swaps a whole value instead.
#
# What changes from the CI build, and why (checked 2026-10-01 on
# developer.apple.com/help/account/reference/supported-capabilities-ios):
#   - signing is automatic, with no team: the person picks their Personal
#     Team in Xcode for both the app and the widget extension;
#   - no Time Sensitive Notifications entitlement: a free account cannot
#     have it, and one unprovisionable entitlement fails the whole install;
#   - whisper.framework is signed when it is copied into the app, which a
#     device install needs (CI's unsigned build leaves that to Sideloadly).

include:
  - project.yml

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGN_IDENTITY: Apple Development

targets:
  # Static and linked into both bundles, never embedded: nothing to sign,
  # and signing it would ask for a team a third time.
  Core:
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO

  VilniusCommute:
    dependencies:REPLACE:
      - target: Core
        embed: false
      - target: VilniusCommuteWidgets
      - framework: Vendor/whisper.xcframework
        embed: true
        codeSign: true
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: libsqlite3.tbd
    entitlements:REPLACE:
      path: App/Supporting/VilniusCommute.entitlements
      properties: {}
